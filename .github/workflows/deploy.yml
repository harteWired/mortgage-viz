name: Deploy to GitHub Pages

# Lab migration note: the canonical home is now
# https://lab.mattharte.com/mortgage-viz/ (Cloudflare Worker, see
# wrangler.jsonc). This workflow keeps the old GitHub Pages URL alive
# as a meta-refresh forwarder so external links don't 404.
#
# To fully decommission: disable Pages in repo Settings → Pages.

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages-redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
